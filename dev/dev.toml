# Development network definition. Override anything in dev/dev.local.toml (gitignored):
# tables merge, and [[servers]] / [[plugins]] entries merge by name / key.

# Must be set to true in dev.local.toml: you accept https://aka.ms/MinecraftEULA
accept_eula = true
# "auto" derives the Minecraft version from paper-api and the Velocity version from velocity-api in
# gradle/libs.versions.toml. Backends run Purpur (a Paper fork, like production).
minecraft_version = "auto"
purpur_build = "auto"      # auto = latest Purpur build for the Minecraft version, or a build number
velocity_version = "auto"  # or e.g. "4.2.1-SNAPSHOT"
velocity_build = "auto"    # or a build id, to pin it exactly (profile imports do)
# Online mode for the proxy; backends always trust the proxy's forwarded identity
online_mode = true
# Address clients use to reach this machine. The proxy transfers players to Limbo and back through it, so
# set it to your LAN/public address (in dev.local.toml) when others join from outside.
public_host = "localhost"
# Limbo only publishes builds for one Minecraft version at a time ("auto" = the one for this version)
limbo_version = "auto"

[jvm]
enhanced_redefinition = true  # -XX:+AllowEnhancedClassRedefinition (needs JetBrains Runtime)
hotswap_agent = true         # -XX:HotswapAgent=fatjar with only the plugins the project's libraries need (not on Limbo)
hotswap_plugins = []         # extra HotswapAgent plugin names to keep loaded, e.g. ["Log4j2"]
extra_flags = []

# Consoles: `dev ui` opens a zellij workspace of live server consoles. Layouts are generated from the enabled
# instances (network, tabs); add your own as dev/layouts.local/<name>.kdl.
[ui]
default_layout = "network"
session = "paradisu"

# `dev web start` serves that workspace to a browser (zellij web client)
[web]
port = 8082
bind = "127.0.0.1"  # 0.0.0.0 exposes it to the network over HTTPS (self-signed); also publish the port in docker-compose.yml

# `dev share start` opens public tunnels (no port forwarding needed): the proxy and Limbo over TCP, the web
# console over HTTPS. Free Pinggy tunnels get a new random address every 60 minutes; `dev share` renews them and
# updates the proxy's transfer addresses, but players connected through an expiring tunnel are disconnected.
[share]
provider = "pinggy"
targets = ["proxy", "limbo"]
renew_before_seconds = 30
# Velocity then sees real player IPs, but while the proxy is shared it accepts only connections that carry the
# header, so direct joins (localhost, LAN) stop working: use the tunnel address, or set "off"
proxy_protocol = "v2"

# Put the token in dev.local.toml or PINGGY_TOKEN, never here (Pro: stable address, no 60-minute limit)
[share.providers.pinggy]
#token = ""
#max_lifetime_minutes = 60
#max_concurrent = 2  # refuse to share more targets than this at once

# `dev capture`: packet capture plugin (devtools/capture), loaded on every instance when enabled. It costs almost
# nothing while no capture is running; restart instances after changing it.
[capture]
enabled = true
gzip_level = 3          # 1 (fast) to 9 (small); compression runs on a background thread
max_size = "512M"       # default cap on captured (uncompressed) bytes per instance
queue_capacity = 65536  # packets buffered for the writer; when full, packets are dropped and counted, never blocking the server

[proxy]
port = 25565
debug_port = 5005
memory = "512M"
first_start_commands = []

# A standalone Limbo server (waiting room used by /vparadisu maintenance). It is not part of the proxy's
# server list: the Paradisu proxy config points at it (limbo-server) and tells it, over ConnectorPlugin, to
# transfer players back when the proxy starts.
[limbo]
enabled = true
port = 30000
debug_port = 5008
memory = "256M"
first_start_commands = []

[[servers]]
name = "lobby"
enabled = true
port = 30066
debug_port = 5006
memory = "2G"
try = true
world_preset = "redstone_ready"  # or "void" or "default"
first_start_commands = []
context = { server = "lobby", warp = "paradisu", inventory = "paradisu" }

[[servers]]
name = "creative"
enabled = true  # enable in dev.local.toml for cross-server testing
port = 30067
debug_port = 5007
memory = "2G"
try = true
world_preset = "redstone_ready"
first_start_commands = []
context = { server = "creative", warp = "creative", inventory = "creative" }

# Plugins: source = "modrinth" | "url" | "local"; platforms = ["paper", "velocity"]
# Preset configs live in dev/templates/plugins/<key>/<platform>/ and land in plugins/<config_dir>/.
[[plugins]]
key = "connectorplugin"
source = "url"
platforms = ["paper", "velocity", "limbo"]
# One universal jar (Bukkit, Velocity and Limbo); not on Modrinth
url = "https://ci.minebench.de/job/ConnectorPlugin/lastSuccessfulBuild/artifact/target/ConnectorPlugin.jar"
config_dir = { paper = "ConnectorPlugin", velocity = "connectorplugin", limbo = "ConnectorPlugin" }

# Adds /transfer and /transferall to Limbo; GitHub releases of the repository
[[plugins]]
key = "limbotransfer"
source = "github"
repo = "Kas-tle/LimboTransfer"
platforms = ["limbo"]

[[plugins]]
key = "luckperms"
source = "modrinth"
slug = "luckperms"
platforms = ["paper", "velocity"]
config_dir = { paper = "LuckPerms", velocity = "luckperms" }

[[plugins]]
key = "fawe"
source = "modrinth"
slug = "fastasyncworldedit"
platforms = ["paper"]
config_dir = { paper = "FastAsyncWorldEdit" }

[[plugins]]
key = "worldguard"
source = "modrinth"
slug = "worldguard"
platforms = ["paper"]
config_dir = { paper = "WorldGuard" }

[[plugins]]
key = "bkcommonlib"
source = "modrinth"
slug = "bkcommonlib"
platforms = ["paper"]
config_dir = { paper = "BKCommonLib" }

[[plugins]]
key = "traincarts"
source = "modrinth"
slug = "traincarts"
platforms = ["paper"]
config_dir = { paper = "Train_Carts" }

# Not on Modrinth: the latest successful build of its Jenkins job
[[plugins]]
key = "tccoasters"
source = "jenkins"
job_url = "https://ci.mg-dev.eu/job/TC%20Coasters"
platforms = ["paper"]
config_dir = { paper = "TCCoasters" }

[[plugins]]
key = "carbonchat"
source = "modrinth"
slug = "carbon"
platforms = ["paper"]
allow_prerelease = true  # only betas are published
config_dir = { paper = "CarbonChat" }
