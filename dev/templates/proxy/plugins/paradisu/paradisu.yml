# Paradisu Main Configuration (rendered by dev/templates; edits here are overwritten on `dev start`)

database:
  url: '${DB_URL}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
# Clients are transferred to these addresses, so they must be reachable by players (see public_host)
limbo-server:
  host: ${PUBLIC_HOST}
  port: ${LIMBO_PUBLIC_PORT}
transfer-return-target:
  host: ${PUBLIC_HOST}
  port: ${PROXY_PUBLIC_PORT}
