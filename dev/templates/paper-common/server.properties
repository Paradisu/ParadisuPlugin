# Rendered by dev/templates; edits here are overwritten on `dev start`. Paper fills in every other key.
server-ip=127.0.0.1
server-port=${SERVER_PORT}
# The proxy authenticates players; the backend trusts Velocity's forwarding (see config/paper-global.yml)
online-mode=false
enforce-secure-profile=false
# New servers ship with the whitelist ON (and empty), which would turn every player away
white-list=false
enforce-whitelist=false
level-type=${LEVEL_TYPE}
generator-settings=${GENERATOR_SETTINGS}
generate-structures=false
difficulty=peaceful
spawn-protection=0
allow-nether=false
view-distance=8
simulation-distance=6
motd=${SERVER_NAME} (dev)
