name: Devcontainer

# The image is built and published by Paradisu/mcdevtools. This workflow checks that the development environment
# (the dev/ submodule, .mcdevtools/ and .devcontainer/) works as a whole.
on:
  push:
    branches:
      - '**'
    paths:
      - '.devcontainer/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'dev'
      - '.mcdevtools/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'settings.gradle.kts'
      - 'database/src/main/resources/db/**'
      - '.vscode/**'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'dev'
      - '.mcdevtools/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'settings.gradle.kts'
      - 'database/src/main/resources/db/**'
      - '.vscode/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Test development environment
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository and Submodules
      # See https://github.com/actions/checkout/releases
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: recursive
    - name: Build Development Image
      # The image of the pinned mcdevtools checkout, so a change to it is tested before it is published
      run: docker build -f dev/devcontainer/Dockerfile -t mcdevtools-devcontainer:local dev
    - name: Run Environment Checks
      # See https://github.com/devcontainers/ci/releases
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
      env:
        # `devcontainer build` builds a thin derived image through Docker Compose, whose bake integration refuses
        # the Dockerfile the devcontainer CLI generates in /tmp
        BUILDX_BAKE_ENTITLEMENTS_FS: '0'
      with:
        configFile: .devcontainer/build-local/devcontainer.json
        push: never
        runCmd: |
          set -e
          dev bootstrap
          test "$(dev db psql -tAc 'select count(*) from players')" = 500
          dev db reset --yes --through 002
          test "$(dev db psql -tAc 'select count(*) from warps where world is null')" -gt 0
          pnpm -r typecheck
          pnpm -r test
          test "$(dev db psql -tAc 'select count(*) from player_inventories')" -gt 0
          dev mc encode '{id:"minecraft:stone",count:1}' | dev mc item -
          dev --no-input profile export ci --include db,plugins,servers --out /tmp/ci.tar.gz
          dev profile inspect /tmp/ci.tar.gz
          ./gradlew build
