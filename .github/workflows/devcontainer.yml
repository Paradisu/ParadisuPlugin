name: Devcontainer

on:
  push:
    branches:
      - '**'
    paths:
      - '.devcontainer/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'dev/**'
      - 'devtools/**'
      - 'database/src/main/resources/db/**'
      - '.vscode/**'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'dev/**'
      - 'devtools/**'
      - 'database/src/main/resources/db/**'
      - '.vscode/**'
      - '.github/workflows/devcontainer.yml'
  schedule:
    # Weekly rebuild to pick up Debian security updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: paradisuplugin-devcontainer

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    env:
      # Only the upstream repository publishes; forks and PRs just build and test
      PUBLISH: ${{ github.event_name != 'pull_request' && github.repository == 'Paradisu/ParadisuPlugin' }}
    steps:
    - name: Checkout Repository
      # See https://github.com/actions/checkout/releases
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set Image Name
      # GHCR requires lowercase repository names
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
    - name: Set up QEMU
      # See https://github.com/docker/setup-qemu-action/releases
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Set up Docker Buildx
      # See https://github.com/docker/setup-buildx-action/releases
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log in to GHCR
      if: ${{ env.PUBLISH == 'true' }}
      # See https://github.com/docker/login-action/releases
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image Metadata
      id: meta
      # See https://github.com/docker/metadata-action/releases
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=sha,format=short
          type=schedule,pattern={{date 'YYYYMMDD'}}
    - name: Build Image for Smoke Test
      # See https://github.com/docker/build-push-action/releases
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: .devcontainer/Dockerfile
        platforms: linux/amd64
        load: true
        tags: ${{ env.IMAGE_NAME }}:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Smoke Test Image
      run: |
        docker run --rm "${IMAGE_NAME}:smoke" bash -lc '
          set -e
          java -version 2>&1 | grep JBR
          javac -version
          node -v | grep "^v24"
          pnpm -v
          psql --version
          tmux -V
          test -d ~/.gradle/wrapper/dists
          test -f /opt/jbr/lib/hotswap/hotswap-agent.jar
        '
    - name: Build and Push Image
      if: ${{ env.PUBLISH == 'true' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: .devcontainer/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  smoke:
    name: Test development environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Build Development Image
      run: docker build -f .devcontainer/Dockerfile -t paradisuplugin-devcontainer:local .
    - name: Run Environment Checks
      # See https://github.com/devcontainers/ci/releases
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
      env:
        # `devcontainer build` builds a thin derived image through Docker Compose, whose bake integration refuses
        # the Dockerfile the devcontainer CLI generates in /tmp
        BUILDX_BAKE_ENTITLEMENTS_FS: '0'
      with:
        configFile: .devcontainer/build-local/devcontainer.json
        push: never
        runCmd: |
          set -e
          dev bootstrap
          test "$(dev db psql -tAc 'select count(*) from players')" = 500
          dev db reset --yes --through 002
          test "$(dev db psql -tAc 'select count(*) from warps where world is null')" -gt 0
          pnpm --dir dev typecheck
          ./gradlew build
