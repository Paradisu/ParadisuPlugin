# Development network definition (docs: dev/docs/environment.md). Override anything in
# .mcdevtools/config.local.toml (gitignored): tables merge, and [[instances]] / [[networks]] / [[plugins]] entries
# merge by name / key.
format = 1

# Starting the network means you accept https://aka.ms/MinecraftEULA (set to false in config.local.toml to refuse)
accept_eula = true
# Address clients use to reach this machine. The proxy transfers players to Limbo and back through it, so
# set it to your LAN/public address (in config.local.toml) when others join from outside.
public_host = "localhost"
# Online mode for the proxy; backends always trust the proxy's forwarded identity
online_mode = true
# Paradisu-specific commands, hooks and template variables: .mcdevtools/extensions/paradisu
extensions = ["extensions/paradisu"]

[versions]
# "auto" derives the Minecraft version from paper-api (and Velocity from velocity-api) in gradle/libs.versions.toml.
# Backends run Purpur (a Paper fork, like production).
minecraft = "auto"

# The plugin jar is built with Gradle before every start and copied into the proxy and backends
[build]
command = ["./gradlew", "-q", "shadowJar"]

[[build.artifacts]]
path = "build/libs/ParadisuPlugin.jar"
platforms = ["paper", "velocity"]

# PostgreSQL: the proxy runs the Liquibase migrations on startup, `mcdev db` rebuilds the database from the same changelogs.
# LuckPerms keeps its own database.
[db]
kind = "postgres"
databases = ["paradisu", "luckperms"]
required = true

[db.migrations]
tool = "liquibase"
search_path = "database/src/main/resources"
changelog = "db/migrations.xml"
seed_dir = "db/seed"

[redis]
enabled = true

[java]
enhanced_redefinition = true  # -XX:+AllowEnhancedClassRedefinition (needs JetBrains Runtime)
hotswap_agent = true         # -XX:HotswapAgent=fatjar with only the plugins the project's libraries need (not on Limbo)
hotswap_plugins = []         # extra HotswapAgent plugin names to keep loaded, e.g. ["Log4j2"]
extra_flags = []

# Consoles: `mcdev ui` opens a zellij workspace of live server consoles. Layouts are generated from the enabled
# instances (network, tabs); add your own as .mcdevtools/layouts.local/<name>.kdl.
[ui]
default_layout = "network"
session = "paradisu"

# `mcdev web start` serves that workspace to a browser (zellij web client)
[web]
port = 8082
bind = "127.0.0.1"  # 0.0.0.0 exposes it to the network over HTTPS (self-signed); also publish the port in docker-compose.yml

# `mcdev share start` opens public tunnels (no port forwarding needed): the proxy and Limbo over TCP, the web
# console over HTTPS. Free Pinggy tunnels get a new random address every 60 minutes; `mcdev share` renews them and
# updates the proxy's transfer addresses, but players connected through an expiring tunnel are disconnected.
[share]
provider = "pinggy"
targets = ["proxy", "limbo"]
renew_before_seconds = 30
# Velocity then sees real player IPs, but while the proxy is shared it accepts only connections that carry the
# header, so direct joins (localhost, LAN) stop working: use the tunnel address, or set "off"
proxy_protocol = "v2"

# Put the token in config.local.toml or PINGGY_TOKEN, never here (Pro: stable address, no 60-minute limit)
[share.providers.pinggy]
#token = ""
#max_lifetime_minutes = 60
#max_concurrent = 2  # refuse to share more targets than this at once

# `mcdev capture`: packet capture (a Java agent, dev/java/capture-agent), added to every instance when enabled. It costs almost
# nothing while no capture is running; restart instances after changing it.
[capture]
enabled = true
gzip_level = 3          # 1 (fast) to 9 (small); compression runs on a background thread
max_size = "512M"       # default cap on captured (uncompressed) bytes per instance
queue_capacity = 65536  # packets buffered for the writer; when full, packets are dropped and counted, never blocking the server

# `mcdev test run`: the JUnit integration tests (integration-tests/) that drive bots against this network (docs: dev/docs/testing.md)
[test]
command = ["./gradlew", ":integration-tests:integrationTest"]
reports = "integration-tests/build/test-results/integrationTest"
capture = "on-failure"           # keep a packet capture of a test only when it fails: always, on-failure or never
export = ["flashback"]           # replay formats made from a kept capture (`mcdev capture formats`)
# Server log lines that fail the test that was running; add known noise to log_ignore_patterns
log_fail_patterns = ["\\bERROR\\b", "Exception"]
log_ignore_patterns = []
in_game = true                  # install the in-game manual test runner on Paper instances: `mcdev manual run <suite> --player <name>`
manual_dir = "tests/manual"      # manual test suites, relative to .mcdevtools

[[networks]]
name = "main"
forwarding = "modern"

[[instances]]
name = "proxy"
type = "velocity"
network = "main"
port = 25565
debug_port = 5005
memory = "512M"
first_start_commands = []
# version = "auto"   # or e.g. "4.2.1-SNAPSHOT"; build = "auto" or a build id, to pin it exactly (profile imports do)

# A standalone Limbo server (waiting room used by /vparadisu maintenance). It is not part of the network's server
# list: the Paradisu proxy config points at it (limbo-server) and tells it, over ConnectorPlugin, to transfer players
# back when the proxy starts. Limbo only publishes builds for one Minecraft version at a time.
[[instances]]
name = "limbo"
type = "limbo"
enabled = true
port = 30000
debug_port = 5008
memory = "256M"
first_start_commands = []

[[instances]]
name = "lobby"
type = "purpur"
network = "main"
enabled = true
port = 30066
debug_port = 5006
memory = "2G"
try = true
world_preset = "redstone_ready"  # or "void" or "default"
first_start_commands = []
context = { server = "lobby", warp = "paradisu", inventory = "paradisu" }

[[instances]]
name = "creative"
type = "purpur"
network = "main"
enabled = true  # second backend for cross-server testing; set enabled = false in config.local.toml to save memory
port = 30067
debug_port = 5007
memory = "2G"
try = true
world_preset = "redstone_ready"
first_start_commands = []
context = { server = "creative", warp = "creative", inventory = "creative" }

# Plugins: source = "modrinth" | "url" | "local"; platforms = ["paper", "velocity"]
# Preset configs live in .mcdevtools/templates/plugins/<key>/<platform>/ and land in plugins/<config_dir>/.
[[plugins]]
key = "connectorplugin"
source = "url"
platforms = ["paper", "velocity", "limbo"]
# One universal jar (Bukkit, Velocity and Limbo); not on Modrinth
url = "https://ci.minebench.de/job/ConnectorPlugin/lastSuccessfulBuild/artifact/target/ConnectorPlugin.jar"
config_dir = { paper = "ConnectorPlugin", velocity = "connectorplugin", limbo = "ConnectorPlugin" }

# Adds /transfer and /transferall to Limbo; GitHub releases of the repository
[[plugins]]
key = "limbotransfer"
source = "github"
repo = "Kas-tle/LimboTransfer"
platforms = ["limbo"]

[[plugins]]
key = "luckperms"
source = "modrinth"
slug = "luckperms"
platforms = ["paper", "velocity"]
config_dir = { paper = "LuckPerms", velocity = "luckperms" }

[[plugins]]
key = "fawe"
source = "modrinth"
slug = "fastasyncworldedit"
platforms = ["paper"]
config_dir = { paper = "FastAsyncWorldEdit" }

[[plugins]]
key = "worldguard"
source = "modrinth"
slug = "worldguard"
platforms = ["paper"]
config_dir = { paper = "WorldGuard" }

[[plugins]]
key = "bkcommonlib"
source = "modrinth"
slug = "bkcommonlib"
platforms = ["paper"]
config_dir = { paper = "BKCommonLib" }

[[plugins]]
key = "traincarts"
source = "modrinth"
slug = "traincarts"
platforms = ["paper"]
config_dir = { paper = "Train_Carts" }

# Not on Modrinth: the latest successful build of its Jenkins job
[[plugins]]
key = "tccoasters"
source = "jenkins"
job_url = "https://ci.mg-dev.eu/job/TC%20Coasters"
platforms = ["paper"]
config_dir = { paper = "TCCoasters" }

[[plugins]]
key = "carbonchat"
source = "modrinth"
slug = "carbon"
platforms = ["paper"]
allow_prerelease = true  # only betas are published
config_dir = { paper = "CarbonChat" }
