cloud-minecraft = "2.0.1"
configurate-yaml = "4.2.0"
connectorplugin = "1.5.2-SNAPSHOT"
fastutil = "8.5.2"
gson = "2.8.9"
guava = "33.7.2-jre"
hibernate = "7.4.13.Final"
indra = "4.0.0"
liquibase = "5.0.4"
